[FilterPlugin]
; BuildPlugin은 정해진 폴더(Source, Content, Resources, Config, Binaries)만 담는다.
; 루트에 있는 파일은 여기 적어야 들어간다.
;
; README는 문서라서 담는다.
;
; LICENSE는 일부러 빼 둔다. 처음에는 "산 사람이 무엇을 허락받았는지 확인할 곳이 있어야 한다"고
; 넣었는데, Fab 심사에서 그것 때문에 반려됐다. Fab 라이선스가 다른 모든 라이선스에 우선하므로
; 패키지에 별도 라이선스 파일이 들어 있으면 산 사람을 헷갈리게 한다는 이유였다.
/README.md

; 아래는 빼는 것들. 규칙 앞의 '-'가 제외를 뜻한다.

; 이 프로젝트에서 손으로 만든 테스트 위젯이다. 부모 클래스가 이 플러그인이 아니라
; 이 프로젝트의 게임 모듈에 있어서, 그대로 담으면 산 사람은 부모 없는 에셋을 받는다.
-/Content/Samples/WBP_Test.uasset

; README에 붙는 데모 GIF다. 저장소에서 읽히면 되고, 산 사람이 받는 플러그인에는 필요 없다.
-/Docs/...

; 디버그 심볼. 1.4MB DLL에 71MB가 딸려 간다. 받는 쪽에서 쓸 일이 없다.
-/Binaries/*/*.pdb
